<style id="pwa-css">
.pwa-toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:70;max-width:540px;margin:0 auto;
 display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 12px 12px 14px;
 background:var(--sheet,#fff);color:var(--ink,#1D1533);border:1px solid var(--rule,#DCD6E8);border-left:4px solid var(--pen,#4A2BB0);border-radius:var(--r2,14px);
 box-shadow:0 18px 40px -18px rgba(29,21,51,.5),0 2px 6px rgba(29,21,51,.08);font:15px/1.45 var(--sans,system-ui,sans-serif);
 animation:pwa-in .28s cubic-bezier(.2,.8,.2,1)}
.pwa-toast[data-kind="ready"]{border-left-color:var(--ok,#0B7656)}
.pwa-toast[data-kind="offline"]{border-left-color:var(--gold,#C98500)}
.pwa-ico{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--pen-soft,#ECE7FB);color:var(--pen,#4A2BB0)}
.pwa-toast[data-kind="ready"] .pwa-ico{background:var(--ok-soft,#DDF2E9);color:var(--ok,#0B7656)}
.pwa-toast[data-kind="offline"] .pwa-ico{background:var(--gold-soft,#FCF0D4);color:var(--gold,#C98500)}
.pwa-ico svg{width:20px;height:20px}
.pwa-txt{flex:1 1 200px;min-width:0;margin:0}
.pwa-txt b{display:block;font:700 15px/1.3 var(--display,var(--sans,system-ui,sans-serif))}
.pwa-txt span{display:block;color:var(--muted,#605873);font-size:14px}
.pwa-txt strong{color:var(--ink,#1D1533)}
.pwa-txt svg{width:15px;height:15px;vertical-align:-2px}
.pwa-acts{display:flex;gap:6px;margin-left:auto}
.pwa-b{min-height:40px;padding:0 16px;border-radius:99px;border:1.5px solid var(--pen,#4A2BB0);background:var(--pen,#4A2BB0);color:var(--onpen,#fff);
 font:700 14px var(--sans,system-ui,sans-serif);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pwa-b.q{background:transparent;color:var(--pen,#4A2BB0);border-color:transparent}
.pwa-b:hover{filter:brightness(1.08)}
.pwa-b:focus-visible{outline:3px solid var(--pen,#4A2BB0);outline-offset:2px}
.pwa-toast.out{animation:pwa-out .2s ease-in forwards}
@keyframes pwa-in{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes pwa-out{to{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.pwa-toast,.pwa-toast.out{animation:none}}
.wl-mark{white-space:nowrap}
@media print{.pwa-toast{display:none}}
</style>
<style id="zmotion">
/* Motion: one easing family, short durations, content-only (sticky bars and the header never move on navigation). */

html{-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion:no-preference){

 html.zreveal #catA:not([hidden]),html.zreveal #frB:not([hidden]){animation:z-arrive .45s var(--z-out) backwards}
 /* switching sections */
 #catA:not([hidden])>main,#frB:not([hidden]) .b-main{animation:z-rise .34s var(--z-out) backwards}
 #catA section[id^="p-"]:not([hidden]){animation:z-rise .32s var(--z-out) backwards}
 #b-content>*{animation:z-rise .36s var(--z-out) backwards}
 #b-content>:nth-child(2){animation-delay:.035s}#b-content>:nth-child(3){animation-delay:.07s}
 #b-content>:nth-child(4){animation-delay:.105s}#b-content>:nth-child(n+5){animation-delay:.14s}
 #frC:not([hidden]){animation:z-fade .3s ease-out backwards}
 /* state changes glide instead of snapping */
 .omr button,.sub button{transition:border-color .25s,color .2s,background-color .2s}
 .omr .bub{transition:background-color .25s,border-color .25s,color .25s,box-shadow .35s,transform .4s var(--z-spring)}
 .b-nav a,.tbtn,.zl-btn,.btn,.b-btn{transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s,transform .18s var(--z-out)}
 .zl-dot{transition:background-color .5s,box-shadow .5s,border-color .5s}
 /* touch feedback */
 .omr button:active .bub{transform:scale(.9)}
 .sub button:active,.b-nav a:active,.tbtn:active,.zl-btn:active,.btn:active,.b-btn:active,.pwa-b:active{transform:scale(.96)}
 details>summary{transition:color .2s}
 details[open]>:not(summary){animation:z-rise .26s var(--z-out) backwards}
}
@media (prefers-reduced-motion:reduce){
 #catA:not([hidden])>main,#frB:not([hidden]) .b-main,#catA section[id^="p-"]:not([hidden]),#b-content>*,#frC:not([hidden]){animation:z-fade .15s linear backwards}
}
@keyframes z-arrive{from{opacity:0;transform:translate3d(0,18px,0) scale(.985)}}
@keyframes z-rise{from{opacity:0;transform:translate3d(0,12px,0)}}
@keyframes z-drop{from{opacity:0;transform:translate3d(0,-10px,0)}}
@keyframes z-fade{from{opacity:0}}
</style>
<script>// Zola PWA layer: install offer (Android, desktop and iOS), offline-ready and update notices,

 share:SVG+'<path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>'
};

 t.classList.add('out');setTimeout(function(){t.remove()},mm('(prefers-reduced-motion: reduce)')?0:220)}

 if(toast&&kind===o.kind)return;
 if(toast){toast.remove();toast=null;clearTimeout(timer)}
 var t=document.createElement('div');t.className='pwa-toast';t.dataset.kind=o.kind;
 t.setAttribute('role','status');t.setAttribute('aria-live','polite');
 var i=document.createElement('div');i.className='pwa-ico';i.innerHTML=ICON[o.icon||o.kind]||'';t.appendChild(i);
 var p=document.createElement('p');p.className='pwa-txt';var b=document.createElement('b');b.textContent=o.title;p.appendChild(b);
 var s=document.createElement('span');if(o.html)s.innerHTML=o.html;else s.textContent=o.text||'';p.appendChild(s);t.appendChild(p);
 if(o.action||o.later){var a=document.createElement('div');a.className='pwa-acts';
  if(o.later)a.appendChild(btn(o.later,'q',o.onLater));
  if(o.action)a.appendChild(btn(o.action,'',o.onAction));t.appendChild(a)}
 t.addEventListener('keydown',function(e){if(e.key==='Escape'){hide();o.onLater&&o.onLater()}});
 document.body.appendChild(t);toast=t;kind=o.kind;
 if(o.ttl)timer=setTimeout(function(){hide(o.kind)},o.ttl);

(function(){var d=document.documentElement;if(!d.classList.contains('zboot'))return;var done=false;

  d.classList.add('zout','zreveal');var m=document.getElementById('zboot-meta');if(m)m.remove();

   requestAnimationFrame(function(){requestAnimationFrame(lift)})})}

// Let the learner see the app first: offer on a return visit, or after half a minute on the first.

var ua=navigator.userAgent||'';
var ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(standalone())document.documentElement.classList.add('pwa-standalone');

 if(!deferred||standalone()||snoozed())return;

  later:'Not now',onLater:snooze,action:'Install',onAction:function(){var d=deferred;deferred=null;if(!d)return;d.prompt();
   Promise.resolve(d.userChoice).then(function(c){if(c&&c.outcome==='dismissed')snooze()},noop)}});

 show({kind:'ios',icon:'install',title:'Install Zola Corpus',html:'Tap '+ICON.share+' <strong>Share</strong>, then <strong>Add to Home Screen</strong>. It then works offline.',
  later:'Got it',onLater:snooze});
});

// ---- Durable storage: keep progress safe from the browser's storage clean-ups once installed --
function persist(){var s=navigator.storage;if(s&&s.persist&&s.persisted)s.persisted().then(function(p){return p||s.persist()}).catch(noop)}
if(standalone())persist();

// ---- Home-screen shortcuts open the requested section in the window that is already running --
if(window.launchQueue&&launchQueue.setConsumer)launchQueue.setConsumer(function(p){
 try{var h=p&&p.targetURL?new URL(p.targetURL).hash:'';if(h&&h!==location.hash)location.hash=h}catch(e){}});

function offerUpdate(){show({kind:'update',title:'New build ready',text:'A newer Zola Corpus has been saved on this device.',
 later:'Later',action:'Reload',onAction:function(){location.reload()}})}

 if(!navigator.onLine||Date.now()-(+get('checkedAt')||0)<15*60e3)return;set('checkedAt',Date.now());
 if(reg)reg.update().catch(noop);

  if(had)offerUpdate();

   show({kind:'ready',title:'Ready to work offline',text:'Zola Corpus is now saved on this device.',ttl:6500})}
  had=true});

 window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'./'}).then(function(r){reg=r},noop)});
 document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check()});
}

window.addEventListener('offline',function(){show({kind:'offline',title:'You are offline',text:'Everything saved on this device keeps working.',ttl:7000})});
window.addEventListener('online',function(){hide('offline')});

// ---- Keep the phone's status bar in step with the in-app theme button ----------------------
var metas=[].slice.call(document.querySelectorAll('meta[name="theme-color"]:not(#zboot-meta)'));
metas.forEach(function(m){m.dataset.def=m.getAttribute('content');m.dataset.media=m.getAttribute('media')||''});
function syncBar(){var t=document.documentElement.getAttribute('data-theme');
 if(t==='light'||t==='dark'){var c=getComputedStyle(document.documentElement).getPropertyValue('--sheet').trim();
  if(c)metas.forEach(function(m){m.setAttribute('content',c);m.removeAttribute('media')})}
 else metas.forEach(function(m){m.setAttribute('content',m.dataset.def);if(m.dataset.media)m.setAttribute('media',m.dataset.media)})}

<style id="zneo">
/* ── Boardroom Neon: the Zola design layer ───────────────────────────────────────────────────
   Violet ink stays the suit. Magenta and cyan are the pocket square: hairlines, active states,
   key figures. Fills that carry text use the deep violet→magenta pair only, never cyan. */
:root{
 --neo-v:#4A2BB0;--neo-m:#B5179E;--neo-c:#0E9FC2;
 --neo-line:linear-gradient(100deg,#4A2BB0 0%,#B5179E 52%,#0E9FC2 100%);
 --neo-line-v:linear-gradient(180deg,#4A2BB0 0%,#B5179E 60%,#0E9FC2 100%);
 --neo-fill:linear-gradient(110deg,#4A2BB0 0%,#7A22B4 48%,#A3168E 100%);
 --neo-text:linear-gradient(100deg,#4A2BB0 10%,#A3168E 90%);
 --neo-glow:0 10px 26px -14px rgba(163,22,142,.55);
 --neo-ring:rgba(181,23,158,.16);
 --neo-wash-a:rgba(110,72,255,.11);--neo-wash-b:rgba(14,159,194,.08);--neo-wash-c:rgba(181,23,158,.07);
 --neo-grid:rgba(74,43,176,.09);--neo-grid-o:.55;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --neo-v:#A98BFF;--neo-m:#FF5CCB;--neo-c:#38E1F5;
 --neo-line:linear-gradient(100deg,#8B6BFF 0%,#FF4FC3 52%,#2DDCF2 100%);
 --neo-line-v:linear-gradient(180deg,#8B6BFF 0%,#FF4FC3 60%,#2DDCF2 100%);
 --neo-fill:linear-gradient(110deg,#5B3BE0 0%,#8E2BD0 48%,#C2189B 100%);
 --neo-text:linear-gradient(100deg,#C9B8FF 0%,#FF8AD8 55%,#86ECF8 100%);
 --neo-glow:0 0 26px -6px rgba(255,79,195,.55);
 --neo-ring:rgba(255,79,195,.22);
 --neo-wash-a:rgba(139,107,255,.20);--neo-wash-b:rgba(45,220,242,.10);--neo-wash-c:rgba(255,79,195,.13);
 --neo-grid:rgba(255,79,195,.30);--neo-grid-o:.9}}
:root[data-theme="dark"]{
 --neo-v:#A98BFF;--neo-m:#FF5CCB;--neo-c:#38E1F5;
 --neo-line:linear-gradient(100deg,#8B6BFF 0%,#FF4FC3 52%,#2DDCF2 100%);
 --neo-line-v:linear-gradient(180deg,#8B6BFF 0%,#FF4FC3 60%,#2DDCF2 100%);
 --neo-fill:linear-gradient(110deg,#5B3BE0 0%,#8E2BD0 48%,#C2189B 100%);
 --neo-text:linear-gradient(100deg,#C9B8FF 0%,#FF8AD8 55%,#86ECF8 100%);
 --neo-glow:0 0 26px -6px rgba(255,79,195,.55);
 --neo-ring:rgba(255,79,195,.22);
 --neo-wash-a:rgba(139,107,255,.20);--neo-wash-b:rgba(45,220,242,.10);--neo-wash-c:rgba(255,79,195,.13);
 --neo-grid:rgba(255,79,195,.30);--neo-grid-o:.9}

/* type: Space Grotesk headlines sit a touch tighter; JetBrains Mono carries the small print like a spec sheet */
h2.sec,#frB .b-hero h1,#frB h1,#frB h2{letter-spacing:-.03em}
body{font-feature-settings:"kern","liga","ss04"}
.stat .num,.clock .num,.score,#frB .b-id,#frB .b-ledger b{font-feature-settings:"tnum","ss04"}
.clock{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase}
.ttl small{font-family:var(--mono);font-size:11px;letter-spacing:.01em}
.tag{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tier{font-family:var(--mono);font-weight:700}
.score small{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase}
details.item dt,.b-kv dt,#frB .b-kv dt{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
th{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#frB .b-eyebrow{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
#frB .b-pill,#frB .b-meta,.zl-date{font-family:var(--mono);font-size:11px;letter-spacing:.02em}
#frB .b-ledger span{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.stat span{letter-spacing:.005em}

/* atmosphere: soft neon washes, and a synthwave horizon grid that only peeks between cards */
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none}
body::before{inset:0;background:
 radial-gradient(70vmax 55vmax at -10% -10%,var(--neo-wash-a),transparent 62%),
 radial-gradient(55vmax 45vmax at 110% 8%,var(--neo-wash-b),transparent 60%),
 radial-gradient(70vmax 55vmax at 85% 110%,var(--neo-wash-c),transparent 62%)}
body::after{left:-60%;right:-60%;bottom:-2px;height:42vh;opacity:var(--neo-grid-o);
 background:repeating-linear-gradient(90deg,var(--neo-grid) 0 1px,transparent 1px 72px),repeating-linear-gradient(0deg,var(--neo-grid) 0 1px,transparent 1px 72px);
 transform:perspective(320px) rotateX(64deg);transform-origin:50% 100%;
 -webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.5) 40%,transparent 92%);mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.5) 40%,transparent 92%)}
::selection{background:var(--neo-m);color:#fff}
:focus-visible{outline-color:var(--neo-c)}
html{scrollbar-color:color-mix(in srgb,var(--neo-v) 50%,transparent) transparent;scrollbar-width:thin}

/* header: neon hairline that doubles as the reading-progress bar */
.hdr{border-bottom-color:transparent}
.hdr::before{background:var(--neo-line-v)}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;background:var(--neo-line);opacity:.45}
.zprog{position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none;background:var(--neo-line);transform-origin:0 50%;transform:scaleX(var(--zprog,0));box-shadow:0 0 12px -2px var(--neo-m);transition:transform .12s linear}
.clock .num{background:var(--neo-text);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.mark.wl-mark{position:relative;overflow:hidden;background:linear-gradient(110deg,#C42A42,#B21E63);border-color:transparent}
.mark.wl-mark::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;pointer-events:none;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);opacity:0}

/* category tabs: neon underline draws in from the centre; the bubble fills with the deep gradient */
.omr button{background:var(--neo-line) 50% 100%/0% 3px no-repeat}
.omr button[aria-selected="true"]{border-bottom-color:transparent;background-size:100% 3px}
.omr button[aria-selected="true"] .bub{background:var(--neo-fill);border-color:transparent;color:#fff;box-shadow:0 0 0 4px var(--neo-ring),var(--neo-glow)}
.sub button{background:var(--neo-line) 50% 100%/0% 3px no-repeat}
.sub button[aria-selected="true"]{border-bottom-color:transparent;background-size:100% 3px}
#frB .b-nav a[aria-current="page"],.b-nav a[aria-current="page"]{background:var(--neo-fill);color:#fff;box-shadow:var(--neo-glow)}
#frB .b-tabs button[aria-pressed="true"]{box-shadow:0 1px 4px rgba(0,0,0,.12),inset 0 -2px 0 var(--neo-m)}

/* type: a chapter mark above section titles, neon on the figures that matter */
h2.sec::before{content:"";display:block;width:46px;height:4px;border-radius:4px;background:var(--neo-line);margin:0 0 .45em}
.spine{border-left-color:var(--neo-v);border-image:var(--neo-line-v) 1}
#frB .b-eyebrow{background:var(--neo-text);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
#frB .b-card .b-id,#frB .b-hero h1 span:first-child{background:var(--neo-text);-webkit-background-clip:text;background-clip:text;color:transparent}

/* stat tiles */
.stat{position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--neo-line)}
.stat .num,#frB .b-ledger b,#frB .b-ledger strong{background:var(--neo-text);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}

/* tracker: tier S carries the neon, A the violet, B stays quiet */
.tier.S{background:var(--neo-fill);border-color:transparent;color:#fff;box-shadow:var(--neo-glow)}

<script>// Zola UX: each section remembers where you were, the header steps aside while reading,
// and exam dates go into the phone's calendar.
(function(){
'use strict';
var d=document.documentElement,se=function(){return document.scrollingElement||d};

  window.scrollTo({top:target,behavior:'instant'});d.classList.remove('zcollapse');

});

  if(Date.now()<quietUntil||y<80){d.classList.remove('zcollapse');acc=0;return}
  acc=(dy>0)===(acc>0)?acc+dy:dy;
  if(acc>28)d.classList.add('zcollapse');else if(acc<-10)d.classList.remove('zcollapse')},{passive:true});

  L.push('END:VEVENT')});

  var acts=document.createElement('div');acts.className='zc-acts';

  body.appendChild(acts);
  var note=document.createElement('p');note.className='zc-note';note.textContent='Opens in your calendar app with reminders a week and a day before. Dates come from the official calendar via the Zola feed; check them against the source if they change.';body.appendChild(note);
 }).catch(function(){body.innerHTML='<p class="zc-note">Connect to the internet once so Zola can fetch the exam dates, then try again.</p>'});
}
// The countdown opens it
var clock=document.getElementById('clock');
if(clock){clock.setAttribute('role','button');clock.tabIndex=0;clock.title='Exam dates · add to calendar';
 clock.addEventListener('click',sheet);clock.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();sheet()}})}
// …and so does a button under any exam list the app shows

 if(!list||list.dataset.zcal)return;list.dataset.zcal='1';var b=document.createElement('button');b.type='button';b.className='btn ghost zcal-add';
 b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 14v4M10 16h4"/></svg>Add exam dates to my calendar';
 b.addEventListener('click',sheet);list.insertAdjacentElement('afterend',b)})}
if(window.MutationObserver){var t=0;new MutationObserver(function(){clearTimeout(t);t=setTimeout(addButtons,120)}).observe(document.getElementById('catA')||document.body,{childList:true,subtree:true})}
addButtons();
})();

<script>// Complete backups and one-tap section access. No requests or third-party code.
(function(){
'use strict';
var data=window.ZOLA_DATA,MAX=20000000,DAY=864e5,REM='zola.pwa.backupReminderAt',LAST='zola.pwa.lastBackupAt';
function keys(){return Object.keys(localStorage).filter(data.storageKey).sort()}
function snapshot(){var values={};keys().forEach(function(k){values[k]=localStorage.getItem(k)});return {schema:'zola-backup/1',exported:new Date().toISOString(),edition:window.ZOLA_LIVE?ZOLA_LIVE.info().app:'2.4',storage:values}}
function validate(v){
 if(!v||v.schema!=='zola-backup/1'||!data.time(v.exported)||typeof v.edition!=='string'||!v.storage||typeof v.storage!=='object'||Array.isArray(v.storage))throw new Error('Not a valid Zola backup file.');
 data.safe(v);var ks=Object.keys(v.storage);if(ks.length>1000||JSON.stringify(v).length>MAX)throw new Error('Backup is too large.');
 ks.forEach(function(k){if(!data.storageKey(k))throw new Error('Unsupported storage key: '+k);data.storageValue(k,v.storage[k])});return v;
}
function restore(v){ // Storage is replaced only after all values pass validation.
 validate(v);var before={},current=keys(),incoming=Object.keys(v.storage);
 current.forEach(function(k){before[k]=localStorage.getItem(k)});
 var written=[],removed=[];
 try{incoming.forEach(function(k){localStorage.setItem(k,v.storage[k]);written.push(k)});current.forEach(function(k){if(!Object.prototype.hasOwnProperty.call(v.storage,k)){localStorage.removeItem(k);removed.push(k)}})}
 catch(e){ // Do not clear existing data before finding out whether writes are allowed.
  written.forEach(function(k){if(!Object.prototype.hasOwnProperty.call(before,k))localStorage.removeItem(k)});
  written.concat(removed).forEach(function(k){if(Object.prototype.hasOwnProperty.call(before,k)&&localStorage.getItem(k)!==before[k])localStorage.setItem(k,before[k])});
  throw new Error('Restore could not be saved. Your previous data was restored. '+e.message)}
}
function counts(v){var b={},c={};try{b=JSON.parse(v.storage['zolaB.v22']||'{}');c=JSON.parse(v.storage['zolaCsatForge.v1']||'{}')}catch(e){}
 return {traps:Object.keys(b.traps||{}).length,walks:Object.keys(b.walks||{}).length,questions:(c.ledger||[]).length,mocks:(c.mocks||[]).length,unfinished:!!c.live,keys:Object.keys(v.storage).length};
}
window.ZOLA_BACKUP={snapshot:snapshot,validate:validate,restore:restore};
var brief=document.getElementById('p-brief'),tools=document.createElement('section');tools.className='box zbackup-tools';tools.setAttribute('aria-label','Back up and restore progress');
tools.innerHTML='<p><b>Your progress</b><small>Save Hacking, CSAT and Forecast data together.</small></p><button type="button" class="btn" id="zbackup-save">Back up</button><button type="button" class="btn ghost" id="zbackup-open">Restore</button><span id="zbackup-status" role="status"></span>';
if(brief){var intro=brief.querySelector('.read');if(intro)intro.insertAdjacentElement('afterend',tools);else brief.prepend(tools)}
var input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.hidden=true;input.id='zbackup-file';document.body.appendChild(input);
var dlg=document.createElement('dialog');dlg.id='zbackup';dlg.setAttribute('aria-labelledby','zbackup-title');
dlg.innerHTML='<h2 id="zbackup-title">Restore your backup</h2><p id="zbackup-summary"></p><p>This replaces all Zola progress and settings on this device. The app will reload. Back up your current progress first if you want to keep it.</p><p id="zbackup-error" role="alert"></p><div class="zbackup-acts"><button type="button" class="btn ghost" id="zbackup-cancel">Cancel</button><button type="button" class="btn" id="zbackup-confirm">Replace and reload</button></div>';
document.body.appendChild(dlg);var pending=null,reading=false;
function status(s){document.getElementById('zbackup-status').textContent=s}
function backUp(){try{
 var v=snapshot(),blob=new Blob([JSON.stringify(v,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=u;a.download='zola-backup-'+v.exported.slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
 localStorage.setItem(LAST,String(Date.now()));var n=document.getElementById('zbackup-reminder');if(n)n.remove();status('Backup downloaded.');
}catch(e){status('Backup failed: '+e.message)}}
document.getElementById('zbackup-save').addEventListener('click',backUp);
document.getElementById('zbackup-open').addEventListener('click',function(){if(!reading)input.click()});
input.addEventListener('change',function(){var f=input.files[0];input.value='';pending=null;if(!f)return;
 if(f.size>MAX){status('Restore refused: file exceeds 20 MB.');return}
 reading=true;document.getElementById('zbackup-open').disabled=true;
 f.text().then(function(t){var v=validate(JSON.parse(t)),c=counts(v);pending=v;
  document.getElementById('zbackup-summary').textContent='Saved '+new Date(v.exported).toLocaleString()+', edition '+v.edition+'. '+c.traps+' trap records, '+c.walks+' walkthroughs, '+c.questions+' CSAT answers, '+c.mocks+' mock results'+(c.unfinished?', one unfinished paper':'')+'; '+c.keys+' saved keys.';
  document.getElementById('zbackup-error').textContent='';dlg.showModal();
 }).catch(function(e){status('Restore refused: '+e.message)}).then(function(){reading=false;document.getElementById('zbackup-open').disabled=false});
});
document.getElementById('zbackup-cancel').addEventListener('click',function(){dlg.close()});
dlg.addEventListener('close',function(){pending=null});
document.getElementById('zbackup-confirm').addEventListener('click',function(){if(!pending)return;try{restore(pending);location.reload()}catch(e){document.getElementById('zbackup-error').textContent=e.message}});
function reminder(){try{
 var s=snapshot(),c=counts(s);if(!c.traps&&!c.questions&&!c.mocks&&!c.walks&&!c.unfinished)return;
 var last=+(localStorage.getItem(LAST)||0),rem=+(localStorage.getItem(REM)||0),first=+(localStorage.getItem('zola.pwa.progressSince')||0);
 if(!first){first=Date.now();var b=JSON.parse(s.storage['zolaB.v22']||'{}'),f=JSON.parse(s.storage['zolaCsatForge.v1']||'{}');Object.keys(b.traps||{}).forEach(function(k){(b.traps[k].hist||[]).forEach(function(h){if(h.at>0)first=Math.min(first,h.at)})});(f.ledger||[]).concat(f.mocks||[]).forEach(function(r){if(r.ts>0)first=Math.min(first,r.ts)});localStorage.setItem('zola.pwa.progressSince',String(first))}
 if(Date.now()-Math.max(last,first)<14*DAY||Date.now()-rem<14*DAY)return;
 var notice=document.createElement('p');notice.id='zbackup-reminder';notice.setAttribute('role','status');notice.textContent='Keep a copy of your progress: it has been at least two weeks since your last backup.';tools.appendChild(notice);localStorage.setItem(REM,String(Date.now()));
}catch(e){}}
setTimeout(reminder,3000);

// A real overflow button opens all seven sections in one tap, including the hidden ones.
var bar=document.querySelector('.sub'),strip=bar&&bar.querySelector('.in');
if(!bar||!strip)return;
var tabs=[].slice.call(strip.querySelectorAll('button')),more=document.createElement('button'),menu=document.createElement('div');
more.type='button';more.className='zsections';more.textContent='›';more.setAttribute('aria-label','Show all Forecast sections');more.setAttribute('aria-expanded','false');more.setAttribute('aria-controls','zsections-menu');
menu.id='zsections-menu';menu.hidden=true;menu.setAttribute('role','group');menu.setAttribute('aria-label','Forecast sections');
function closeMenu(focus){menu.hidden=true;more.setAttribute('aria-expanded','false');if(focus)more.focus({preventScroll:true})}
tabs.forEach(function(tab){var b=document.createElement('button');b.type='button';b.textContent=tab.textContent;
 b.addEventListener('click',function(){closeMenu(false);tab.click();tab.focus({preventScroll:true});reveal(tab)});menu.appendChild(b)});
function reveal(tab){var left=tab.offsetLeft,right=left+tab.offsetWidth;if(left<strip.scrollLeft)strip.scrollLeft=left;else if(right>strip.scrollLeft+strip.clientWidth-58)strip.scrollLeft=right-strip.clientWidth+58}
function update(){var overflow=strip.scrollWidth>strip.clientWidth+2;bar.classList.toggle('zoverflow',overflow);more.hidden=!overflow;
 // The owner router treats all .sub buttons as tabs; these utility buttons are not tabs.
 more.removeAttribute('aria-selected');more.tabIndex=0;
 more.textContent=strip.scrollLeft+strip.clientWidth>=strip.scrollWidth-2?'⋯':'›';
 tabs.forEach(function(t,i){var b=menu.children[i];b.removeAttribute('aria-selected');b.tabIndex=0;if(t.getAttribute('aria-selected')==='true')b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(!overflow)closeMenu(false)}
more.addEventListener('click',function(){if(!menu.hidden){closeMenu(true);return}update();menu.hidden=false;more.setAttribute('aria-expanded','true');menu.querySelector('[aria-current]')&&menu.querySelector('[aria-current]').focus()});
menu.addEventListener('keydown',function(e){var bs=[].slice.call(menu.children),i=bs.indexOf(document.activeElement),j;
 if(e.key==='Escape'){e.preventDefault();closeMenu(true)}
 if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Home'||e.key==='End'){e.preventDefault();j=e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs[j].focus()}});
document.addEventListener('click',function(e){if(!bar.contains(e.target))closeMenu(false)});
bar.addEventListener('focusout',function(){setTimeout(function(){if(!bar.contains(document.activeElement))closeMenu(false)},0)});
bar.appendChild(more);bar.appendChild(menu);strip.addEventListener('scroll',update,{passive:true});
addEventListener('resize',update);addEventListener('hashchange',function(){closeMenu(false);update();var t=strip.querySelector('[aria-selected="true"]');if(t)reveal(t)});
if(window.ResizeObserver)new ResizeObserver(update).observe(strip);update();
})();
</script>
